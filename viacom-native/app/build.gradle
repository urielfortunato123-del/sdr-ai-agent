plugins {
    id 'com.android.application'
}

android {
    namespace 'com.uriel.livmessenger'
    compileSdk 35

    defaultConfig {
        applicationId 'com.uriel.livmessenger'
        minSdk 26
        targetSdk 35
        versionCode 400
        versionName '0.4.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-nearby:19.5.0'
}

// LIV Messenger 0.4.0 clean-room messenger shell + offline Nearby transport
