name: LIV Cleanroom Android Build

on:
  push:
    branches:
      - liv-cleanroom-v040
    paths:
      - 'viacom-native/**'
      - '.github/workflows/viacom-native-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build release APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle -p viacom-native :app:assembleRelease --stacktrace 2>&1 | tee build.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liv-messenger-0.4.0-build
          path: |
            build.log
            viacom-native/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore
          retention-days: 1
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
