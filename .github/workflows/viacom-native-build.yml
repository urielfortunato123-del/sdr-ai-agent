name: ViaCom Native Build

on:
  push:
    branches:
      - viacom-native-v020
    paths:
      - 'viacom-native/**'
      - '.github/workflows/viacom-native-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        run: gradle -p viacom-native :app:assembleRelease --stacktrace

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: viacom-0.2.1-unsigned
          path: viacom-native/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1
