name: LIV Messenger Android Build

on:
  push:
    branches:
      - liv-messenger-v030
    paths:
      - 'viacom-native/**'
      - '.github/workflows/viacom-native-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Patch callback Activity context
        shell: bash
        run: |
          SRC='viacom-native/app/src/main/java/com/uriel/viacom/beta016/MainActivity.java'
          sed -i 's/Toast.makeText(this, "Conectado a @"/Toast.makeText(MainActivity.this, "Conectado a @"/' "$SRC"
          sed -i 's/Toast.makeText(this, "Conexão não concluída. Código: "/Toast.makeText(MainActivity.this, "Conexão não concluída. Código: "/' "$SRC"

      - name: Build release APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle -p viacom-native :app:assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liv-messenger-0.3.0-build
          path: |
            build.log
            viacom-native/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore
          retention-days: 1

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
